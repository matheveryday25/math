<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Ro16 [DEMO]</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/matheveryday25/math/ro16/favicon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas#canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #logo {
            width: 400px;
            margin-bottom: 50px;
        }

        #loading-text {
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }

    </style>
    <script>if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('https://cdn.jsdelivr.net/gh/matheveryday25/math/ro16/coi-serviceworker.js').then(function(reg) {
      if (!crossOriginIsolated) { location.reload(); }
    });
  }</script>
</head>
<body>
    <div id="loading">
        <img id="logo" src="https://cdn.jsdelivr.net/gh/matheveryday25/math/ro16/WebBlox.png">
        <span id="loading-text">Loading...</span>
    </div>
    <canvas id="canvas" oncontextmenu="return false"></canvas>
    <script>(function () {
    var CDN = 'https://cdn.jsdelivr.net/gh/matheveryday25/math/ro16/';

    var loadingDiv  = document.getElementById('loading');
    var loadingText = document.getElementById('loading-text');

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    console.log  = function () {};
    console.warn = function () {};
    console.info = function () {};
    console.debug = function () {};

    var CHUNK_COUNT = 18;
    var WASM_PARTS = 2;
    var TOTAL_PARTS = CHUNK_COUNT + WASM_PARTS;
    var loaded = 0;

    function countUp() {
      loaded++;
      loadingText.textContent = 'Loading ' + Math.round(loaded / TOTAL_PARTS * 100) + '%';
    }

    var chunksPromise = Promise.all(
      Array.from({ length: CHUNK_COUNT }, function (_, i) {
        return fetch(CDN + 'rblx.data.' + i).then(function (r) {
          if (!r.ok) throw new Error('chunk ' + i + ' failed');
          return r.arrayBuffer().then(function (b) {
            countUp();
            return b;
          });
        });
      })
    ).then(function (chunks) {
      var total = chunks.reduce(function (s, c) { return s + c.byteLength; }, 0);
      var out   = new Uint8Array(total);
      var off   = 0;
      chunks.forEach(function (c) { out.set(new Uint8Array(c), off); off += c.byteLength; });
      return URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
    });

    var wasmPromise = Promise.all(
      Array.from({ length: WASM_PARTS }, function (_, i) {
        return fetch(CDN + 'rblx.wasm.' + i).then(function (r) {
          if (!r.ok) throw new Error('wasm part ' + i + ' failed');
          return r.arrayBuffer().then(function (b) {
            countUp();
            return b;
          });
        });
      })
    ).then(function (parts) {
      var total = parts.reduce(function (s, c) { return s + c.byteLength; }, 0);
      var out   = new Uint8Array(total);
      var off   = 0;
      parts.forEach(function (c) { out.set(new Uint8Array(c), off); off += c.byteLength; });
      return URL.createObjectURL(new Blob([out], { type: 'application/wasm' }));
    });

    var _origFetch = window.fetch.bind(window);
    window.fetch = function (resource, init) {
      var url = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
      if (/rblx\.data(\?|$)/.test(url)) {
        return chunksPromise.then(function (blobUrl) { return _origFetch(blobUrl, init); });
      }
      if (/rblx\.wasm(\?|$)/.test(url)) {
        return wasmPromise.then(function (blobUrl) { return _origFetch(blobUrl, init); });
      }
      return _origFetch(resource, init);
    };

    window.Module = {
      canvas: document.getElementById('canvas'),
      // Any other file the loader asks for (workers, etc.) is also pulled from the CDN
      locateFile: function (path) { return CDN + path; },
      print:    function () {},
      printErr: function (t) { if (/error|exception/i.test(t)) console.error('[rblx]', t); },
      setStatus: function (t) {
        if (!t) { loadingDiv.style.display = 'none'; return; }
        var m = t.match(/\((\d+)\/(\d+)\)/);
        if (m) {
          var pct = Math.round(parseInt(m[1], 10) / parseInt(m[2], 10) * 100);
          loadingText.textContent = 'Loading ' + pct + '%';
        }
      },
      onRuntimeInitialized: function () { loadingDiv.style.display = 'none'; }
    };

    var s = document.createElement('script');
    s.src = CDN + 'rblx.js';
    document.body.appendChild(s);
  })();</script>
</body>
</html>
